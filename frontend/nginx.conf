server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # En-têtes de sécurité (hérités par les blocs location, qui n'utilisent pas add_header)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://live.staticflickr.com https://*.staticflickr.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

  # Ressources versionnées par le build Angular : cache long
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
    expires 1y;
    try_files $uri =404;
  }

  # Application monopage : toute autre route renvoie index.html, jamais mis en cache
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
